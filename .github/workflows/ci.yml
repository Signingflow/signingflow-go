name: SDK Go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | awk '/^total:/ { gsub("%","",$3); print $3 > ".coverage-percent"; if ($3+0 < 80) { print "coverage " $3 "% is below 80"; exit 1 } }'
      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.go == '1.26'
        run: bash .github/publish-coverage-badge.sh "$(cat .coverage-percent)"
